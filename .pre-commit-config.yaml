# =============================================================================
# aegis-spark .pre-commit-config.yaml
# =============================================================================
exclude: '^(\.agents/|\.benchmarks/|\.pixi/|\.rumdl_cache/|alire/|alire_install/|bin/|build/|config/|dist/|obj/|AGENT\.md|GEMINI\.md)'

repos:
  # ---------------------------------------------------------------------------
  # 1. Repository & File Hygiene (pre-commit-hooks v6.0.0)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: '(^|/)pixi\.lock$'
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-ast
      - id: debug-statements

  # ---------------------------------------------------------------------------
  # 2. ISO C23 Formatting & Static Analysis (clang-format & clang-tidy)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 98ad4ddb9c057de2f5b9e93e44e6db959807d68c # frozen: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy C23 static analysis (pixi)
        entry: pixi run clang-tidy
        language: system
        files: '^src/.*\.(c|h)$|^\.clang-tidy$|^\.clangd$|^aegis_spark\.gpr$'
        pass_filenames: false
        require_serial: true

  # ---------------------------------------------------------------------------
  # 3. SPARK Ada 2022 Contract, Build & Proof Verification
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: verify-spark-contracts
        name: Verify SPARK Ada 2022 Contracts & Hygiene
        entry: pixi run verify-spark
        language: system
        files: '^src/.*\.(ads|adb)$|^aegis_spark\.gpr$|^gnat\.adc$'
        pass_filenames: false
        require_serial: true

      - id: alire-spark-build-and-prove
        name: Alire SPARK Ada 2022 Validation Build & Gold Proof
        entry: bash -c 'export PATH="$HOME/.local/bin:$HOME/development/alr/bin:/opt/homebrew/bin:$PATH"; alr --non-interactive build --validation && alr --non-interactive gnatprove --level=2 -j0'
        language: system
        files: '^src/.*\.(ads|adb|c|h)$|^aegis_spark\.gpr$|^gnat\.adc$|^alire\.toml$'
        pass_filenames: false
        require_serial: true

  # ---------------------------------------------------------------------------
  # 4. Markdown Formatting & Linting (rumdl v0.2.79)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 3429bee0c8870bff7874f898c6e8659d1ffe9645 # frozen: v0.2.79
    hooks:
      - id: rumdl
        args: [--fix]
      - id: rumdl-fmt

  # ---------------------------------------------------------------------------
  # 5. Renovate Config Validation (renovatebot 44.140.0)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: fe4cf9af7f73a6386a2c4d23a5ef8bac33fb7abc # frozen: 44.140.0
    hooks:
      - id: renovate-config-validator
        files: '^renovate\.jsonc?$'

  # ---------------------------------------------------------------------------
  # 6. Local Pixi Tasks (Ruff, Mypy, CI Hygiene, Gitleaks, Actionlint, Zizmor)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (pixi)
        entry: pixi run lint-fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format (pixi)
        entry: pixi run format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy (pixi)
        entry: pixi run typecheck
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false

      - id: agent-ci-hygiene
        name: Verify Directory Layout & Repository Hygiene
        entry: pixi run check-hygiene
        language: system
        pass_filenames: false

      - id: sort-pyproject-toml
        name: Check pyproject.toml Ordering
        entry: pixi run sort-pyproject-toml
        files: ^pyproject\.toml$
        language: system
        pass_filenames: false

      - id: gitleaks
        name: Detect Hardcoded Secrets (gitleaks)
        entry: bash -c 'if command -v gitleaks >/dev/null 2>&1; then gitleaks detect --no-git -c .gitleaks.toml -v; elif command -v pixi >/dev/null 2>&1; then pixi run python -c "from scripts.ci.agent_ci_hygiene import check_secret_hygiene, REPO_ROOT; import sys; sys.exit(1) if check_secret_hygiene(REPO_ROOT) else sys.exit(0)"; elif command -v python3 >/dev/null 2>&1; then python3 -c "from scripts.ci.agent_ci_hygiene import check_secret_hygiene, REPO_ROOT; import sys; sys.exit(1) if check_secret_hygiene(REPO_ROOT) else sys.exit(0)"; fi'
        language: system
        pass_filenames: false

      - id: actionlint
        name: Lint GitHub Actions Workflows (actionlint)
        entry: pixi run actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        types: [yaml]
        pass_filenames: true

      - id: zizmor
        name: Security Audit GitHub Actions (zizmor)
        entry: pixi run zizmor
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        types: [yaml]
        pass_filenames: false
        args: [".github/workflows/"]
